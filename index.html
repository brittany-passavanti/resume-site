<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Brittany Passavanti</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --paper: rgba(253, 251, 248, 0.42);
            --paper-border: rgba(255, 255, 255, 0.34);
            --text: #312923;
            --muted: #6d6057;
            --accent: #c6621f;
            --shadow: 0 28px 70px rgba(55, 40, 28, 0.18);
        }

        body {
            min-height: 100vh;
            font-family: Georgia, "Times New Roman", serif;
            color: var(--text);
            background-color: #efe8e1;
            background-image: linear-gradient(rgba(24, 18, 14, 0.42), rgba(24, 18, 14, 0.42)), url('assets/highlands.png');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            padding: 10vh 24px 18vh;
            position: relative;
        }

        .card {
            width: min(920px, 100%);
            display: grid;
            grid-template-columns: 250px minmax(0, 1fr);
            gap: 34px;
            align-items: center;
            padding: 34px;
            border-radius: 30px;
            background: var(--paper);
            border: 1px solid var(--paper-border);
            box-shadow: var(--shadow);
            backdrop-filter: blur(4px);
            margin: 0 auto;
        }

        .photo-wrap {
            display: flex;
            justify-content: center;
        }

        .profile-photo {
            width: 220px;
            height: 220px;
            border-radius: 50%;
            object-fit: cover;
            object-position: center 30%;
            border: 4px solid rgba(198, 98, 31, 0.28);
            box-shadow: 0 16px 34px rgba(55, 40, 28, 0.16);
        }

        .eyebrow {
            margin-bottom: 10px;
            font-size: 12px;
            letter-spacing: 0.18em;
            text-transform: uppercase;
            color: var(--muted);
        }

        h1 {
            margin-bottom: 14px;
            font-size: clamp(38px, 6vw, 60px);
            line-height: 0.98;
            color: var(--accent);
            font-weight: 600;
        }

        @media (max-width: 760px) {
            .card {
                grid-template-columns: 1fr;
                text-align: center;
                gap: 24px;
                padding: 28px 24px;
            }

            .photo-wrap {
                justify-content: center;
            }

            .profile-photo {
                width: 190px;
                height: 190px;
            }
        }

        .scene-note {
            position: fixed;
            right: 24px;
            bottom: 18px;
            transform: none;
            color: rgba(255, 255, 255, 0.82);
            font-size: 12px;
            letter-spacing: 0.06em;
        }
    </style>
</head>
<body>
    <main class="card">
        <div class="photo-wrap">
            <img class="profile-photo" src="assets/profile.jpg" alt="Portrait of Brittany Passavanti">
        </div>
        <section>
            <div class="eyebrow">Hello</div>
            <h1>I'm Brittany.</h1>
        </section>
    </main>
    <div class="scene-note">Glencoe, Scotland</div>
</body>
</html>
