<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Interview Notes</title>
<style>
  *, *::before, *::after { box-sizing: border-box; }

  :root {
    --bg: #0f172a;
    --bg-soft: rgba(15, 23, 42, 0.78);
    --panel: rgba(255, 255, 255, 0.94);
    --panel-border: rgba(255, 255, 255, 0.26);
    --text: #0f172a;
    --muted: #64748b;
    --accent: #0e8fc7;
    --danger: #b91c1c;
    --shadow: 0 24px 60px rgba(2, 8, 23, 0.28);
    --font: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }

  html, body {
    height: 100%;
    margin: 0;
  }

  body {
    font-family: var(--font);
    background:
      linear-gradient(rgba(10, 18, 32, 0.55), rgba(10, 18, 32, 0.7)),
      url("../assets/highlands.png") center / cover fixed no-repeat;
    color: #e2e8f0;
  }

  .gate-shell {
    min-height: 100vh;
    display: grid;
    place-items: center;
    padding: 32px;
  }

  .gate-card {
    width: min(460px, 100%);
    padding: 28px;
    border-radius: 24px;
    background: var(--bg-soft);
    border: 1px solid var(--panel-border);
    box-shadow: var(--shadow);
    backdrop-filter: blur(16px);
  }

  .eyebrow {
    margin-bottom: 10px;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: rgba(226, 232, 240, 0.74);
  }

  h1 {
    margin: 0 0 12px;
    font-size: clamp(30px, 6vw, 42px);
    line-height: 1.05;
    letter-spacing: -0.04em;
    color: #ffffff;
  }

  .subtext {
    margin: 0 0 22px;
    font-size: 15px;
    line-height: 1.7;
    color: rgba(226, 232, 240, 0.82);
  }

  .field-label {
    display: block;
    margin-bottom: 8px;
    font-size: 12px;
    font-weight: 700;
    color: rgba(226, 232, 240, 0.84);
  }

  .field-row {
    display: grid;
    grid-template-columns: 1fr auto;
    gap: 10px;
  }

  input[type="password"] {
    width: 100%;
    padding: 14px 16px;
    border-radius: 14px;
    border: 1px solid rgba(226, 232, 240, 0.22);
    background: rgba(255, 255, 255, 0.96);
    color: var(--text);
    font-size: 16px;
  }

  input[type="password"]:focus {
    outline: 2px solid rgba(56, 189, 248, 0.4);
    outline-offset: 2px;
  }

  button {
    border: 0;
    border-radius: 14px;
    padding: 14px 18px;
    background: linear-gradient(180deg, #38bdf8 0%, #0e8fc7 100%);
    color: #ffffff;
    font-size: 14px;
    font-weight: 800;
    letter-spacing: 0.01em;
    cursor: pointer;
  }

  button:hover,
  button:focus-visible {
    filter: brightness(1.03);
    outline: none;
  }

  .error {
    min-height: 20px;
    margin-top: 12px;
    font-size: 13px;
    color: #fecaca;
  }

  .notes-shell {
    display: none;
    height: 100vh;
    width: 100%;
    background: #f7f4ef;
  }

  .notes-shell.active {
    display: block;
  }

  .notes-frame {
    display: block;
    width: 100%;
    height: 100vh;
    border: 0;
    background: #f7f4ef;
  }
</style>
</head>
<body>
  <div class="gate-shell" id="gate-shell">
    <div class="gate-card">
      <div class="eyebrow">Private Page</div>
      <h1>Interview Notes</h1>
      <p class="subtext">Enter the password to view the notes page.</p>
      <form id="gate-form">
        <label class="field-label" for="password-input">Password</label>
        <div class="field-row">
          <input id="password-input" name="password" type="password" autocomplete="current-password" required>
          <button type="submit">Enter</button>
        </div>
        <div class="error" id="error-message" aria-live="polite"></div>
      </form>
    </div>
  </div>

  <div class="notes-shell" id="notes-shell">
    <iframe class="notes-frame" src="content.html" title="Interview notes"></iframe>
  </div>

<script>
  const PASSWORD = "Beesly2012!!";
  const STORAGE_KEY = "interviewnotes-access";
  const gateShell = document.getElementById("gate-shell");
  const notesShell = document.getElementById("notes-shell");
  const gateForm = document.getElementById("gate-form");
  const passwordInput = document.getElementById("password-input");
  const errorMessage = document.getElementById("error-message");

  function showNotes() {
    gateShell.style.display = "none";
    notesShell.classList.add("active");
  }

  if (sessionStorage.getItem(STORAGE_KEY) === "granted") {
    showNotes();
  }

  gateForm.addEventListener("submit", (event) => {
    event.preventDefault();
    if (passwordInput.value === PASSWORD) {
      sessionStorage.setItem(STORAGE_KEY, "granted");
      errorMessage.textContent = "";
      showNotes();
      return;
    }

    errorMessage.textContent = "Incorrect password.";
    passwordInput.select();
  });
</script>
</body>
</html>
